# Hamzonics public checker: nginx -> web (Next.js) + api (FastAPI); worker (Celery,
# 3 checks at a time); searxng (free self-hosted web search for Internet sources);
# postgres (pgvector) + redis. Needs at least 2 vCPU / 8 GB for 3 parallel checks.
name: hamzonics

x-python-env: &python-env
  # Server: .env.  Local Docker test: HZ_ENV_FILE=.env.docker (see README).
  env_file: ${HZ_ENV_FILE:-.env}
  volumes:
    - app_data:/data
    # The site's one logo file, also used in the PDF report (worker/report.py LOGO_FILE).
    - ./frontend/public/logo.png:/app/frontend/public/logo.png:ro
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *python-env
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    image: hamzonics-python:latest
    environment:
      TRUST_PROXY_HEADERS: "true"
    command: ["sh", "-c", "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *python-env
    image: hamzonics-python:latest
    # --concurrency = MAX_CONCURRENT_CHECKS: exactly that many checks run at once, the rest queue.
    # The sample corpus is indexed in the background on start (unchanged documents are skipped).
    command: ["sh", "-c", "(python -m scripts.index_corpus corpus/wikipedia/sample.jsonl > /data/index-corpus.log 2>&1 &) ; celery -A worker.celery_app worker -B -s /data/celerybeat-schedule -Q checks --concurrency=${MAX_CONCURRENT_CHECKS:-3} --prefetch-multiplier=1 --loglevel=INFO"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # The host Nginx (deploy/host-nginx.conf) terminates HTTPS and proxies to this port.
      - "127.0.0.1:8080:80"
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  app_data:
