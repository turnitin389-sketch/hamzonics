# Internal Nginx inside the Docker stack (listens on 80, published to
# 127.0.0.1:8080). The VPS host Nginx adds TLS in Phase 9 and proxies here.
server {
    listen 80;
    server_name _;

    # 25 MB upload limit + multipart overhead
    client_max_body_size 26m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Look container names up at request time (Docker DNS), not once at start: after
    # `docker compose up --build` the web/api containers get new IPs (502 otherwise).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # "../" path tricks (also URL-encoded) are refused outright: nginx would resolve them and
    # send the request to a different app (the website answered 500).
    if ($request_uri ~* "(\.|%2e)(\.|%2e)(/|%2f|\\|%5c)") {
        return 400;
    }
    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        # The host Nginx puts the visitor's IP in X-Real-IP; pass it on (used for rate limiting).
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass $web_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
