# Host Nginx on the VPS (outside Docker): HTTPS for your domain -> the Docker stack on 127.0.0.1:8080.
# 1. Copy to /etc/nginx/sites-available/hamzonics and replace check.example.com with your domain.
# 2. ln -s /etc/nginx/sites-available/hamzonics /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# 3. certbot --nginx -d check.example.com     (free HTTPS certificate, renews automatically)
server {
    listen 80;
    server_name check.example.com;

    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
