<div style="width: 100%; padding: 0 16mm; font-family: 'Segoe UI', 'Noto Sans', Arial, sans-serif; font-size: 7.5pt; color: #5b6472; display: flex; align-items: center; justify-content: space-between; -webkit-print-color-adjust: exact; print-color-adjust: exact;">
  <span style="display: flex; align-items: center; gap: 14pt;">
    <span style="display: flex; align-items: center; gap: 4pt; font-weight: 700; font-size: 9pt; color: #1f2937;">
      <img src="{{ logo_uri }}" style="height: 14px; width: auto;" alt="{{ app_name }}" />
      <span>Report</span>
    </span>
    <span>Page <span class="pageNumber"></span> of <span class="totalPages"></span></span>

  <span>Submission ID&nbsp;&nbsp;{{ display_id }}</span>
</div>
